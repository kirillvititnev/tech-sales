# Overlay for Mac Mini server: restart containers after reboot / Docker Desktop start.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.mac-mini.yml --profile vpn up -d --build

services:
  postgres:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  api:
    restart: unless-stopped
  worker:
    restart: unless-stopped
  web:
    restart: unless-stopped
  xray:
    restart: unless-stopped

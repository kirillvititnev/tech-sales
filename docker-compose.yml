services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whiteshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whiteshop}
      POSTGRES_DB: ${POSTGRES_DB:-whiteshop}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whiteshop}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-whiteshop}:${POSTGRES_PASSWORD:-whiteshop}@postgres:5432/${POSTGRES_DB:-whiteshop}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app/apps/api
      - ./apps/worker:/app/apps/worker
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-whiteshop}:${POSTGRES_PASSWORD:-whiteshop}@postgres:5432/${POSTGRES_DB:-whiteshop}
      REDIS_URL: redis://redis:6379/0
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-}
    volumes:
      - ./apps/api:/app/apps/api
      - ./apps/worker:/app/apps/worker
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # VLESS Reality client — only on VPS when Telegram is blocked.
  # Local (abroad): do not start. Keep TELEGRAM_PROXY empty.
  # Usage: docker compose --profile vpn up -d xray
  xray:
    profiles: ["vpn"]
    image: teddysun/xray:latest
    restart: unless-stopped
    volumes:
      - ./infra/vpn/xray.config.json:/etc/xray/config.json:ro
    ports:
      # host ports for non-docker workers / debugging
      - "10808:1080" # SOCKS5
      - "10809:1081" # HTTP
    # no published ports needed if only worker uses service DNS `xray:1080`

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
